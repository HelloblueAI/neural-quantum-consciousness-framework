name: Feature request
description: Propose a lab improvement aligned with measurable reasoning
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer an existing starter task if this is your first PR:
        [open good first issues](https://github.com/HelloblueAI/bleujs-reasoning-lab/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22).
        Roadmap: [docs/LAB_PLAN.md](https://github.com/HelloblueAI/bleujs-reasoning-lab/blob/main/docs/LAB_PLAN.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What measurable outcome should improve? (eval pass rate, latency, honesty, etc.)
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope alignment
      options:
        - label: This is a concrete change to the current lab (worker, evals, routing, retrieval, docs) — not a consciousness, quantum, or AGI-claim feature
          required: true
        - label: Can be checked with `pnpm run check` (or `test:eval` / `test:unit`)
          required: false
